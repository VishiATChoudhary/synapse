<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Browser</title>
<link rel="stylesheet" href="../../tokens.css">
<style>
  html, body { margin: 0; height: 100%; background: var(--color-paper); color: var(--color-ink); font: var(--text-base) var(--font-body); overflow: hidden; }
  .bar { height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 10px 0 84px; background: var(--color-sidebar); border-bottom: 1px solid var(--color-border); -webkit-app-region: drag; }
  body.win .bar { padding-left: 10px; }
  .bar > * { -webkit-app-region: no-drag; }
  button { all: unset; box-sizing: border-box; height: 28px; min-width: 28px; padding: 0 8px; display: inline-grid; place-items: center; border-radius: var(--radius-xs); color: var(--color-secondary); cursor: default; white-space: nowrap; }
  button:hover:not(:disabled) { background: var(--color-hover); color: var(--color-ink); }
  button:disabled { opacity: .35; }
  button:focus-visible { outline: 2px solid var(--color-focus); }
  form { flex: 1; min-width: 0; }
  input { width: 100%; box-sizing: border-box; height: 28px; padding: 0 10px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-paper); color: var(--color-ink); font: var(--text-sm) var(--font-body); outline: 0; }
  input:focus { border-color: var(--color-focus); box-shadow: 0 0 0 3px var(--color-focus-soft); }
  .who { font-weight: 500; color: var(--color-ink); padding: 0 6px; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dock { border: 1px solid var(--color-border-strong); }
  .driving { display: none; align-items: center; gap: 6px; padding: 0 8px; height: 26px; border-radius: 13px; background: var(--color-accent-soft); color: var(--color-accent-text); font-size: var(--text-sm); }
  .driving.on { display: inline-flex; }
  .driving i { width: 7px; height: 7px; border-radius: 50%; background: var(--color-accent); animation: pulse 1s infinite alternate; }
  @keyframes pulse { to { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .driving i { animation: none; } }
  /* the agent's tabs, as in the docked panel */
  .tabs { height: 34px; box-sizing: border-box; display: flex; align-items: center; gap: 4px; padding: 0 8px; background: var(--color-sidebar); border-bottom: 1px solid var(--color-border); overflow-x: auto; scrollbar-width: none; }
  .tab { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 6px; height: 26px; min-width: 90px; max-width: 220px; flex: 0 1 220px; padding: 0 4px 0 10px; border-radius: var(--radius-xs); color: var(--color-muted); font-size: var(--text-sm); cursor: default; }
  .tab:hover { background: var(--color-hover); color: var(--color-secondary); }
  .tab[aria-selected='true'] { background: var(--color-paper); color: var(--color-ink); box-shadow: 0 0 0 1px var(--color-border); }
  .tab span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab .x { height: 20px; min-width: 20px; padding: 0; border-radius: 5px; font-size: 13px; opacity: 0; }
  .tab:hover .x, .tab[aria-selected='true'] .x { opacity: 1; }
  .tab.loading span::before { content: '\25CC  '; color: var(--color-accent); }
  .new-tab { height: 24px; min-width: 24px; padding: 0; font-size: 16px; }
</style>
</head>
<body>
  <div class="bar">
    <span class="who" id="who"></span>
    <button id="back" title="Back" aria-label="Back">←</button>
    <button id="forward" title="Forward" aria-label="Forward">→</button>
    <button id="reload" title="Reload" aria-label="Reload">↻</button>
    <form id="go"><input id="url" spellcheck="false" aria-label="Address" placeholder="Search or enter address"></form>
    <span class="driving" id="driving"><i></i><span id="driving-text">Agent is driving</span></span>
    <button id="pause" title="Take over: the agent waits until you hand it back">Take over</button>
    <button id="dock" class="dock" title="Put the browser back next to the agent">Back to agent</button>
  </div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Tabs"></div>
<script>
  const $ = (id) => document.getElementById(id);
  if (!navigator.userAgent.includes('Mac')) document.body.classList.add('win');
  const act = (a, args) => window.agentBrowser.user(a, args);
  $('back').onclick = () => act('back'); $('forward').onclick = () => act('forward'); $('reload').onclick = () => act('reload');
  $('dock').onclick = () => act('dock');
  let paused = false;
  $('pause').onclick = () => act(paused ? 'resume' : 'pause');
  $('go').onsubmit = (e) => { e.preventDefault(); act('go', { url: $('url').value }); $('url').blur(); };
  window.agentBrowser.onState((s) => {
    if (!s) return;
    // the tabs: click to switch, × to close, + for a new one
    const strip = $('tabs');
    strip.replaceChildren(...s.tabs.map((t) => {
      const b = document.createElement('div'); b.className = `tab${t.loading ? ' loading' : ''}`; b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', String(t.id === s.active)); b.title = t.url || t.title;
      const name = document.createElement('span'); name.textContent = t.title || 'New tab';
      const x = document.createElement('button'); x.className = 'x'; x.textContent = '×'; x.title = 'Close tab'; x.setAttribute('aria-label', `Close ${t.title || 'tab'}`);
      x.onclick = (e) => { e.stopPropagation(); act('close-tab', { tab: t.id }); };
      b.onclick = () => act('select-tab', { tab: t.id });
      b.append(name, x); return b;
    }));
    const plus = document.createElement('button'); plus.className = 'new-tab'; plus.textContent = '+'; plus.title = 'New tab'; plus.setAttribute('aria-label', 'New tab');
    plus.onclick = () => act('new-tab'); strip.append(plus);
    $('who').textContent = s.name || '';
    document.title = `${s.name || 'Agent'} · browser`;
    const tab = s.tabs.find((t) => t.id === s.active);
    if (document.activeElement !== $('url')) $('url').value = tab?.url && tab.url !== 'about:blank' ? tab.url : '';
    $('back').disabled = !s.canBack; $('forward').disabled = !s.canForward;
    paused = s.paused;
    $('pause').textContent = paused ? 'Hand back' : 'Take over';
    $('driving').classList.toggle('on', s.driving && !paused);
    $('driving-text').textContent = `${s.name || 'Agent'} is driving`;
  });
</script>
</body>
</html>
